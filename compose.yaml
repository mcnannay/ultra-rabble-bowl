services:
  ultra-rabble-bowl:
    build: .
    image: ultra-rabble-bowl:tsb3
    container_name: ultra-rabble-bowl
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-3000}:3000"
    volumes:
      - ultra-rabble-bowl-cache:/app/cache
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      NO_BROWSER: "1"
    security_opt:
      - no-new-privileges:true

volumes:
  ultra-rabble-bowl-cache:
